Employees:()=>EF?`<div class=c><b>${EF.edit?'Edit':'Add'} employee</b>${[['id','Login ID (lowercase)'],['name','Full name'],['designation','Designation'],['department','Department'],['phone','Phone'],['email','Email'],['pin','PIN (4 to 8 digits)']].map(([k,l])=>`<label>${l}</label><input id=u_${k} value="${esc(EF[k]||'')}" ${k=='id'&&EF.edit?'disabled':''}>`).join('')}<label>Role</label><select id=u_role onchange="$('#acw').style.display=this.value=='manager'?'block':'none'">${['employee','manager','finance','admin','superadmin'].filter(r=>r!='superadmin'||S.me.role=='superadmin').map(r=>`<option${r==EF.role?' selected':''}>${r}</option>`).join('')}</select><div id=acw style="display:${EF.role=='manager'?'block':'none'}"><label>Assign car</label><select id=u_car><option value="">None</option>${opt(S.cars.filter(c=>!c.owner||c.owner==EF.id),c=>`<option value="${c.id}"${c.id==EF.car?' selected':''}>${esc(c.num)} ${esc(c.model)} · ${esc(c.driver)}</option>`)}</select></div><button class=b onclick=usave()>Save</button><button class="b r" onclick="EF=null;render()">Cancel</button></div>`:`<button class=b onclick="EF={role:'employee'};render()">+ Add employee</button><input placeholder=Search style="margin:10px 0" oninput="for(const l of document.querySelectorAll('.em2'))l.style.display=l.textContent.toLowerCase().includes(this.value.toLowerCase())?'':'none'">`+opt(S.users,u=>`<div class="c em2"><b>${esc(u.name)}</b> <span class=t>${esc(u.role)}</span><div class=t>${esc(u.designation)} · ${esc(u.department)}<br>${esc(u.phone)} · ${esc(u.email)}${S.cars.find(c=>c.owner==u.id)?'<br>Dedicated car: '+esc(S.cars.find(c=>c.owner==u.id).num):''}</div><div style="display:flex;gap:8px;margin-top:8px"><button class=g onclick="eu('${u.id}')">Edit</button><button class=g style="color:#8A1F1F" onclick="udel('${u.id}')">Delete</button></div></div>`),
Cars:()=>CF?`<div class=c><b>${CF.id?'Edit':'Add'} car</b>${[['num','Car number'],['model','Model'],['driver','Driver name'],['phone','Driver phone']].map(([k,l])=>`<label>${l}</label><input id=c_${k} value="${esc(CF[k]||'')}">`).join('')}<label>Dedicated to (optional)</label><select id=c_owner><option value="">None</option>${opt(S.users,u=>`<option value=${u.id}${u.id==CF.owner?' selected':''}>${esc(u.name)}`)}</select><label>Status</label><select id=c_status><option value=active>Active<option value=service${CF.status=='service'?' selected':''}>In service</select><button class=b onclick=csave()>Save</button><button class="b r" onclick="CF=null;render()">Cancel</button></div>`:`<button class=b onclick="CF={status:'active'};render()">+ Add car</button>`+opt(S.cars,c=>`<div class=c style="border-left:8px solid ${c.status=='service'?'#B42318':'#12805C'};margin-top:10px"><b>${esc(c.num)}</b> ${esc(c.model)}<div class=t>${esc(c.driver)} · ${esc(c.phone)}${c.owner?'<br>Dedicated: '+esc(nm(c.owner)):''}<br><b>${c.status=='service'?'In service':'Active'}</b></div><div style="display:flex;gap:8px;margin-top:8px"><button class=g onclick="CF={...S.cars.find(x=>x.id=='${c.id}')};render()">Edit</button><button class=g style="color:#8A1F1F" onclick="cdel('${c.id}')">Delete</button></div></div>`),
'Car status':()=>{const c=ocar();if(!c)return'<div class=c><b>No dedicated car</b><div class=t>No car is assigned to you right now. Use <b>Request</b> to book a car like other employees.</div></div>';const ts=S.trips.filter(t=>t.car==c.id),op=ts.find(t=>t.e==null),rq=t=>S.requests.find(r=>r.id==t.req)||{},bk=bkOf(c),st=c.status=='service'?['In service','grey']:op?['In trip','trip']:bk?['Booked: '+esc(nm(bk.uid)),'rejected']:['Available','approved'],up=S.requests.flatMap(r=>AD(r).filter(a=>a.car==c.id&&a.d>=today()&&!doneT(r,a.d)).map(a=>({r,d:a.d}))),row=t=>{const r=rq(t);return`<div class="c ${t.e==null?'trip':'approved'}"><b>${esc(nm(t.uid))}</b>${t.with.length?' with '+esc(t.with.map(nm).join(', ')):''} ${t.e==null?'<span class="bd trip">in trip</span>':''}<div class=t>${dn(t.day)} · ${esc(r.to||'')} · ${esc(r.purpose||'')}<br>Started ${new Date(t.t0).toLocaleTimeString()} at ${t.s} km${t.e!=null?' · closed at '+t.e+' km ('+(t.e-t.s)+' km)':''}<br>Driver ${esc(t.driver)}${t.details?'<br>Details: '+esc(t.details):''}</div></div>`};return`<div class="c ${st[1]}"><b>${esc(c.num)}</b> ${esc(c.model)} <span class="bd ${st[1]}">${st[0]}</span><div class=t>Driver: ${esc(c.driver)} ${esc(c.phone)}</div>${op?`<div class=t style="margin-top:6px">${esc(nm(op.uid))} is using the car since ${new Date(op.t0).toLocaleTimeString()}</div>`:''}</div>`+ownStart(c,op)+(up.length?'<h3>Upcoming bookings</h3>'+opt(up,u=>`<div class="c approved"><b>${esc(nm(u.r.uid))}</b> · ${dn(u.d)}<div class=t>${pc(u.r)}</div></div>`):'')+'<h3>Trips on this car</h3>'+(opt(ts.slice().reverse().slice(0,15),row)||'<p class=t>No trips yet.</p>')}};
const fd=n=>{const d=new Date(FD+'T00:00');d.setDate(d.getDate()+n);FD=iso(d);render()},g=i=>$('#'+i).value;
function req(){if(!SEL.length||!g('d'))return alert('Pick days and add a destination');const sb=$('#sb');if(sb.disabled)return;sb.disabled=true;sb.textContent='Sending...';api('request',{days:SEL,time:g('tm'),from:g('f'),to:g('d'),purpose:g('p'),project:g('j'),foreign:$('#fo').checked,with:[...document.querySelectorAll('.wm:checked')].map(x=>x.value)}).then(o=>{if(o){tab='My trips';SEL=[];render()}else if($('#sb')){$('#sb').disabled=false;$('#sb').textContent='Submit request'}})}
const dec2=(id,mode)=>{const r=S.requests.find(x=>x.id==id),plan={};let nt='';if(mode=='rej')nt=prompt('Reason for rejection')||'';r.days.forEach((d,i)=>{const k=id+'_'+i;if(r.dd?.[d]?.st=='approved'||!$('#dr'+k))return;const st=mode=='all'?'approved':mode=='rej'?'rejected':g('s'+k);plan[d]=st=='approved'?{st,driver:g('dr'+k),car:g('c'+k)}:{st:'rejected',note:mode=='rej'?nt:g('n'+k)}});return api('decide',{id,plan}).then(o=>o&&toast('Decision saved'))},end=id=>api('end',{id,e:g('e'+id),fuel:g('fu'+id),toll:g('to'+id),park:g('pa'+id),details:g('dt'+id)});
const asg=()=>{const u=[...document.querySelectorAll('.am:checked')].map(x=>x.value);if(!u.length)return alert('Select employees');api('assign',{car:AS.car,days:SEL,uids:u,time:g('tm')}).then(o=>{if(o){AS={s:1};SEL=[];render()}})};
const usave=()=>{const u={};['id','name','designation','department','phone','email','pin','role'].forEach(k=>u[k]=g('u_'+k).trim());api('userSave',{u,car:u.role=='manager'?g('u_car'):'',edit:EF.edit?1:0}).then(o=>{if(o){EF=null;render()}})},udel=id=>confirm('Delete this employee?')&&api('userDel',{id}),csave=()=>api('carSave',{old:CF.id||'',c:{num:g('c_num'),model:g('c_model'),driver:g('c_driver'),phone:g('c_phone'),owner:g('c_owner'),status:g('c_status')}}).then(o=>{if(o){CF=null;render()}}),cdel=id=>confirm('Delete this car?')&&api('carDel',{id});
setInterval(refresh,30000);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
auth?api('get').then(o=>o||login()):login();
