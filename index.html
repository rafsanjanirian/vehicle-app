<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fleet</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#12263A">
<style>body{margin:0;font:15px system-ui,sans-serif;background:#F6F7F9;color:#12263A}header{background:#12263A;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}header button{background:none;border:1px solid #fff;color:#fff;border-radius:8px;padding:8px 12px}nav{display:flex;gap:4px;padding:8px;background:#fff;border-bottom:1px solid #D5DBE3;overflow-x:auto}nav button{border:0;background:none;padding:12px 14px;font-size:15px;border-radius:8px;white-space:nowrap}nav .on{background:#0F766E;color:#fff}main{max-width:960px;margin:0 auto;padding:16px}.c{background:#fff;border:1px solid #D5DBE3;border-radius:12px;padding:14px;margin-bottom:12px;overflow-x:auto}label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}input,select,textarea,button.b,button.g{min-height:46px;font-size:16px;border-radius:10px;border:1px solid #B8C2CE;padding:0 12px;box-sizing:border-box;width:100%;background:#fff}textarea{padding:10px;min-height:90px}button.b{background:#0F766E;color:#fff;border:0;font-weight:600;margin-top:10px}button.b.r{background:#fff;color:#8A1F1F;border:1px solid #8A1F1F}button.g{width:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px;border-bottom:1px solid #E6EAF0;text-align:left}.t{color:#4A5B6D;font-size:13px}@media print{header,nav,.np{display:none}}</style></head><body><div id=app></div><script>
const API='https://fleet-api.gazirian2012.workers.dev';let EF=null,CF=null,S=null,tab='',RD='',RP=7,SEL=[],M=0,FD=null,AS={s:1},auth=JSON.parse(localStorage.a||'null');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),nm=i=>S.users.find(u=>u.id==i)?.name||i,cn=i=>S.cars.find(c=>c.id==i)?.num||'',opt=(a,f)=>a.map(f).join('');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=()=>iso(new Date()),q=c=>c?`'${c}'`:'null';
async function api(act,d){try{const r=await fetch(API,{method:'POST',body:JSON.stringify({u:auth?.u,pin:auth?.pin,act,d:{...d,t:new Date().toISOString(),today:today()}})});const j=await r.json();if(j.err)return alert(j.err);S=j;render();return 1}catch(e){alert('No connection. Try again.')}}
async function login(){const r=await(await fetch(API,{method:'POST',body:'{"act":"users"}'})).json();$('#app').innerHTML=`<main><div class=c><h2>${esc(r.company)} fleet</h2><label>Name</label><select id=u>${opt(r.users,u=>`<option value=${u.id}>${esc(u.name)}`)}</select><label>PIN</label><input id=p type=password inputmode=numeric><button class=b onclick=go()>Sign in</button></div></main>`}
async function go(){auth={u:$('#u').value,pin:$('#p').value};await api('get');if(S)localStorage.a=JSON.stringify(auth)}
const TABS={employee:['Request','My trips','Alerts'],admin:['Fleet','Inbox','Assign','Employees','Cars','Report','Alerts'],finance:['Report','Alerts'],owner:['My car','Request','My trips','Alerts']};TABS.superadmin=TABS.admin;
function render(){const t=TABS[S.me.role];if(!t.includes(tab))tab=t[0];$('#app').innerHTML=`<header><b>${esc(S.company)} · ${esc(S.me.name)}</b><button onclick="localStorage.clear();location.reload()">Sign out</button></header><nav>${opt(t,x=>`<button class="${x==tab?'on':''}" onclick="tab='${x}';SEL=[];M=0;AS={s:1};EF=CF=null;render()">${x}</button>`)}</nav><main>${V[tab]()}</main>`}
function cal(car){const b=new Date();b.setDate(1);b.setMonth(b.getMonth()+M);const y=b.getFullYear(),m=b.getMonth(),n=new Date(y,m+1,0).getDate(),bz=car?S.busy[car]||[]:[],sv=car&&S.cars.find(x=>x.id==car).status=='service';let h=`<div style="display:flex;justify-content:space-between;align-items:center"><button class=g onclick="mv(-1,${q(car)})">‹</button><b>${b.toLocaleString('default',{month:'long',year:'numeric'})}</b><button class=g onclick="mv(1,${q(car)})">›</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;text-align:center">`+[...'SMTWTFS'].map(x=>`<span class=t>${x}</span>`).join('')+'<span></span>'.repeat(b.getDay());for(let d=1;d<=n;d++){const s=iso(new Date(y,m,d)),pa=s<today(),rd=bz.includes(s)||sv,sl=SEL.includes(s);h+=`<button ${pa||rd?'disabled':''} onclick="tg('${s}',${q(car)})" style="min-height:44px;border-radius:8px;border:1px solid #B8C2CE;font-size:14px;background:${sl?'#0F766E':pa?'#EEE':rd?'#FBDADA':car?'#D8F0EC':'#fff'};color:${sl?'#fff':'#12263A'}">${d}</button>`}return h+'</div>'}
const mv=(n,c)=>{M+=n;$('#cal').innerHTML=cal(c)},tg=(s,c)=>{SEL=SEL.includes(s)?SEL.filter(x=>x!=s):[...SEL,s].sort();$('#cal').innerHTML=cal(c);$('#sd').textContent=SEL.join(', ')};
const sel=(id,h)=>`<select id=${id}>${h}</select>`,dl=()=>opt(S.drivers,d=>`<option>${esc(d)}`),ul=()=>opt(S.users,u=>`<option value=${u.id}>${esc(u.name)}`),pc=r=>`${esc(r.from)} to ${esc(r.to)} · ${esc(r.purpose)} ${esc(r.project||'')}`,ck=(c,u)=>`<label style="font-weight:400"><input type=checkbox class=${c} value=${u.id} style="width:auto;min-height:0"> ${esc(u.name)}</label>`;
const carOpt=()=>opt(S.cars,c=>`<option value=${c.id}>${esc(c.num)} ${esc(c.model)}${c.status=='service'?' (in service)':''}`);
const V={
Request:()=>`<div class=c><label>Pick one or more days</label><div id=cal>${cal()}</div><p class=t id=sd></p><label>Time (optional)</label><input id=tm type=time><label>From</label><input id=f value=Office><label>Destination</label><input id=d><label>Purpose</label><select id=p><option>Office transport<option>Site visit</select><label>Project (optional)</label><input id=j><label>Travelling with</label>${opt(S.users.filter(u=>u.id!=S.me.id),u=>ck('wm',u))}<button class=b onclick=req()>Submit request</button></div>`,
'My trips':()=>opt(S.requests.filter(r=>r.uid==S.me.id||r.with.includes(S.me.id)).slice().reverse(),r=>{const own=r.uid==S.me.id;return`<div class=c><b>${r.days.join(', ')}</b> · ${esc(r.status)}<div class=t>${pc(r)}${r.car?' · '+esc(cn(r.car)):''}${r.driver?' · '+esc(r.driver)+' '+esc(S.cars.find(c=>c.id==r.car)?.phone||''):''}${r.with.length?'<br>With '+esc(r.with.map(nm).join(', ')):''}${r.note?'<br>'+esc(r.note):''}</div>${r.status=='approved'?opt(r.days,dy=>{const tr=S.trips.find(t=>t.req==r.id&&t.day==dy);return`<div style="border-top:1px solid #E6EAF0;margin-top:8px;padding-top:6px"><b>${dy}</b> `+(tr?(tr.e==null?(own?`started ${tr.s} km<label>Close km</label><input id=e${tr.id} type=number><label>Fuel Tk (optional)</label><input id=fu${tr.id} type=number><label>Toll Tk (optional)</label><input id=to${tr.id} type=number><label>Parking Tk (optional)</label><input id=pa${tr.id} type=number><button class=b onclick="end('${tr.id}')">End trip</button>`:'in progress'):`${tr.s} to ${tr.e} km`):own&&dy==today()?`<label>Start km</label><input id=s${r.id} type=number><button class=b onclick="api('start',{req:'${r.id}',day:'${dy}',s:$('#s${r.id}').value})">Start trip</button>`:'<span class=t>not started</span>')+'</div>'}):''}</div>`})||'<p class=t>No trips yet.</p>',
Alerts:()=>opt(S.feed,f=>`<div class=c>${esc(f.m)}<div class=t>${new Date(f.t).toLocaleString()}</div></div>`)||'<p class=t>No alerts.</p>',
Fleet:()=>{FD=FD||today();return`<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><button class=g onclick=fd(-1)>‹ Previous</button><b style="flex:1;text-align:center">${FD}</b><button class=g onclick=fd(1)>Next day ›</button></div>`+opt(S.cars,c=>{const r=S.requests.find(r=>r.status=='approved'&&r.car==c.id&&r.days.includes(FD)),ow=c.owner&&FD==today()&&c.state!='office',red=c.status=='service'||r||ow;return`<div class=c style="border-left:8px solid ${red?'#B42318':'#12805C'}"><b>${esc(c.num)}</b> ${esc(c.model)}<div class=t>${esc(c.driver)} · <b>${c.status=='service'?'In service':r?'Booked: '+esc(nm(r.uid)):ow?'With owner':'Available'}</b></div></div>`})},
Inbox:()=>opt(S.requests.filter(r=>r.status=='pending'),r=>`<div class=c><b>${esc(nm(r.uid))}</b> · ${r.days.join(', ')} ${esc(r.time||'')}<div class=t>${pc(r)}<br>With ${esc(r.with.map(nm).join(', ')||'none')}</div>${sel('c'+r.id,carOpt())}${sel('dr'+r.id,dl())}<button class=b onclick="dec('${r.id}','approved')">Approve all days</button><button class="b r" onclick="dec('${r.id}','rejected')">Reject</button></div>`)+'<h3>Add riders to an approved car</h3>'+opt(S.requests.filter(r=>r.status=='approved').slice(-6),r=>`<div class=c><b>${esc(nm(r.uid))}</b> · ${esc(cn(r.car))} · ${r.days.join(', ')}<div class=t>With ${esc(r.with.map(nm).join(', ')||'none')}</div>${sel('ar'+r.id,ul())}<button class=b onclick="api('addrider',{id:'${r.id}',uid:$('#ar${r.id}').value})">Add rider</button></div>`),
Assign:()=>AS.s==1?'<p class=t>Choose a car</p>'+opt(S.cars.filter(c=>c.status!='service'),c=>`<button class=c style="width:100%;text-align:left;font-size:15px" onclick="AS={s:2,car:'${c.id}'};SEL=[];M=0;render()"><b>${esc(c.num)}</b> ${esc(c.model)}<div class=t>${esc(c.driver)}</div></button>`):AS.s==2?`<div class=c><b>${esc(cn(AS.car))}</b><p class=t>Green: free. Red: booked. Tap days to select.</p><div id=cal>${cal(AS.car)}</div><p id=sd class=t>${SEL.join(', ')}</p><button class=b onclick="SEL.length?(AS.s=3,render()):alert('Pick at least one day')">Next</button><button class="b r" onclick="AS={s:1};render()">Back</button></div>`:`<div class=c><b>${esc(cn(AS.car))}: ${SEL.join(', ')}</b><label>Employees</label><input placeholder=Search oninput="for(const l of document.querySelectorAll('.em'))l.style.display=l.textContent.toLowerCase().includes(this.value.toLowerCase())?'':'none'">${opt(S.users,u=>ck('am',u).replace('<label','<label class=em'))}<label>Time (optional)</label><input id=tm type=time><button class=b onclick=asg()>Assign and notify</button><button class="b r" onclick="AS.s=2;render()">Back</button></div>`,
Report:()=>{RD=RD||S.drivers[0];const k=Date.now()-RP*864e5;let K=0,C=0;const body=opt(S.trips.filter(t=>t.driver==RD&&t.e!=null&&new Date(t.t0)>=k),t=>{const km=t.e-t.s,c=t.fuel+t.toll+t.park;K+=km;C+=c;return`<tr><td>${new Date(t.t0).toLocaleString()}<td>${esc(cn(t.car))}<td>${t.s}<td>${t.e}<td>${km}<td>${t.fuel}<td>${t.toll+t.park}<td>${c}<td>${km?(c/km).toFixed(2):'-'}</tr>`});return`<div class=np><label>Driver</label><select onchange="RD=this.value;render()">${opt(S.drivers,d=>`<option${d==RD?' selected':''}>${esc(d)}`)}</select><div style="display:flex;gap:8px">${opt([7,15,30],n=>`<button class=b style="${n==RP?'':'background:#fff;color:#12263A;border:1px solid #B8C2CE'}" onclick="RP=${n};render()">${n} days</button>`)}</div></div><div class=c><h3>${esc(RD)}: last ${RP} days</h3><table><tr><th>Date and time<th>Car<th>Start km<th>End km<th>Km<th>Fuel<th>Toll+Park<th>Total Tk<th>Tk/km</tr>${body}<tr><th colspan=4>Total<th>${K}<th><th><th>${C}<th>${K?(C/K).toFixed(2):'-'}</tr></table></div><button class="b np" onclick=print()>Download PDF</button><div class="c np"><b>Delete data</b><label>From</label><input id=pf type=date><label>To</label><input id=pt type=date><button class="b r" onclick="if(confirm('Delete all trips and requests in this range? This cannot be undone.'))api('purge',{from:$('#pf').value,to:$('#pt').value})">Delete range</button></div>`},
Employees:()=>EF?`<div class=c><b>${EF.edit?'Edit':'Add'} employee</b>${[['id','Login ID (lowercase)'],['name','Full name'],['designation','Designation'],['department','Department'],['phone','Phone'],['email','Email'],['pin','PIN (4 to 8 digits)']].map(([k,l])=>`<label>${l}</label><input id=u_${k} value="${esc(EF[k]||'')}" ${k=='id'&&EF.edit?'disabled':''}>`).join('')}<label>Role</label><select id=u_role>${['employee','owner','finance','admin','superadmin'].filter(r=>r!='superadmin'||S.me.role=='superadmin').map(r=>`<option${r==EF.role?' selected':''}>${r}</option>`).join('')}</select><button class=b onclick=usave()>Save</button><button class="b r" onclick="EF=null;render()">Cancel</button></div>`:`<button class=b onclick="EF={role:'employee'};render()">+ Add employee</button><input placeholder=Search style="margin:10px 0" oninput="for(const l of document.querySelectorAll('.em2'))l.style.display=l.textContent.toLowerCase().includes(this.value.toLowerCase())?'':'none'">`+opt(S.users,u=>`<div class="c em2"><b>${esc(u.name)}</b> <span class=t>${esc(u.role)}</span><div class=t>${esc(u.designation)} · ${esc(u.department)}<br>${esc(u.phone)} · ${esc(u.email)}</div><div style="display:flex;gap:8px;margin-top:8px"><button class=g onclick="EF={...S.users.find(x=>x.id=='${u.id}'),edit:1};render()">Edit</button><button class=g style="color:#8A1F1F" onclick="udel('${u.id}')">Delete</button></div></div>`),
Cars:()=>CF?`<div class=c><b>${CF.id?'Edit':'Add'} car</b>${[['num','Car number'],['model','Model'],['driver','Driver name'],['phone','Driver phone']].map(([k,l])=>`<label>${l}</label><input id=c_${k} value="${esc(CF[k]||'')}">`).join('')}<label>Dedicated to (optional)</label><select id=c_owner><option value="">None</option>${opt(S.users,u=>`<option value=${u.id}${u.id==CF.owner?' selected':''}>${esc(u.name)}`)}</select><label>Status</label><select id=c_status><option value=active>Active<option value=service${CF.status=='service'?' selected':''}>In service</select><button class=b onclick=csave()>Save</button><button class="b r" onclick="CF=null;render()">Cancel</button></div>`:`<button class=b onclick="CF={status:'active'};render()">+ Add car</button>`+opt(S.cars,c=>`<div class=c style="border-left:8px solid ${c.status=='service'?'#B42318':'#12805C'};margin-top:10px"><b>${esc(c.num)}</b> ${esc(c.model)}<div class=t>${esc(c.driver)} · ${esc(c.phone)}${c.owner?'<br>Dedicated: '+esc(nm(c.owner)):''}<br><b>${c.status=='service'?'In service':'Active'}</b></div><div style="display:flex;gap:8px;margin-top:8px"><button class=g onclick="CF={...S.cars.find(x=>x.id=='${c.id}')};render()">Edit</button><button class=g style="color:#8A1F1F" onclick="cdel('${c.id}')">Delete</button></div></div>`),
'My car':()=>opt(S.cars.filter(c=>c.owner==S.me.id),c=>`<div class=c><b>${esc(c.num)}: ${c.state=='office'?'free in office':'with you'}</b><button class=b onclick="api('presence',{state:'office'})">I'm in office</button><button class="b r" onclick="api('presence',{state:'away'})">Leaving now</button></div>`)+V.Alerts()};
const fd=n=>{const d=new Date(FD+'T00:00');d.setDate(d.getDate()+n);FD=iso(d);render()},g=i=>$('#'+i).value;
function req(){if(!SEL.length||!g('d'))return alert('Pick days and add a destination');api('request',{days:SEL,time:g('tm'),from:g('f'),to:g('d'),purpose:g('p'),project:g('j'),with:[...document.querySelectorAll('.wm:checked')].map(x=>x.value)}).then(o=>{if(o){tab='My trips';SEL=[];render()}})}
const dec=(id,st)=>api('decide',{id,status:st,car:g('c'+id),driver:g('dr'+id),note:st=='rejected'?prompt('Reason')||'':''}),end=id=>api('end',{id,e:g('e'+id),fuel:g('fu'+id),toll:g('to'+id),park:g('pa'+id)});
const asg=()=>{const u=[...document.querySelectorAll('.am:checked')].map(x=>x.value);if(!u.length)return alert('Select employees');api('assign',{car:AS.car,days:SEL,uids:u,time:g('tm')}).then(o=>{if(o){AS={s:1};SEL=[];render()}})};
const usave=()=>{const u={};['id','name','designation','department','phone','email','pin','role'].forEach(k=>u[k]=g('u_'+k).trim());api('userSave',{u,edit:EF.edit?1:0}).then(o=>{if(o){EF=null;render()}})},udel=id=>confirm('Delete this employee?')&&api('userDel',{id}),csave=()=>api('carSave',{old:CF.id||'',c:{num:g('c_num'),model:g('c_model'),driver:g('c_driver'),phone:g('c_phone'),owner:g('c_owner'),status:g('c_status')}}).then(o=>{if(o){CF=null;render()}}),cdel=id=>confirm('Delete this car?')&&api('carDel',{id});
setInterval(()=>S&&tab=='Alerts'&&api('get'),30000);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
auth?go().then(()=>S||login()):login();
</script></body></html>
